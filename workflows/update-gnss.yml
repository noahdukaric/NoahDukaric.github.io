# Put this file at .github/workflows/update-gnss.yml in your noahdukaric.github.io repo.
# Every 6 hours it downloads current GPS, Galileo and GLONASS orbit data from CelesTrak
# into a gnss/ folder, which the skyplot on the homepage reads first.
name: Update GNSS orbit data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download orbit data from CelesTrak
        run: |
          mkdir -p gnss
          for group in gps-ops galileo glo-ops; do
            curl -fsSL "https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=json" -o "gnss/${group}.json.new" \
              && mv "gnss/${group}.json.new" "gnss/${group}.json" \
              || echo "Kept the previous ${group}.json"
            sleep 5
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add gnss
          git diff --cached --quiet || (git commit -m "Update GNSS orbit data" && git push)
